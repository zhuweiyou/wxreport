# builds
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    binary: wxreport
    main: ./cmd/wxreport
    ldflags:
      - -s
      - -w
    flags:
      - -trimpath

# archives
archives:
  - format: binary

# checksum
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"

# release
release:
  draft: false
  prerelease: false

# changelog
changelog:
  sort: asc
